name: Recompute Models

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Data Refresh"]
    types:
      - completed

jobs:
  model:
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python Environment
        run: |
          $venvScripts = "Y:\Projects\Footy DataNgin\.venv\Scripts"
          if (Test-Path $venvScripts) {
            Write-Host "Configuring runner to use project virtual environment: $venvScripts"
            $venvScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "VIRTUAL_ENV=Y:\Projects\Footy DataNgin\.venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif (Test-Path "Y:\Python3.11.9") {
            Write-Host "Configuring runner to use Python 3.11"
            "Y:\Python3.11.9\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "Y:\Python3.11.9" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
        shell: powershell

      - name: Verify Environment & Core Dependencies
        run: |
          python --version
          python -c "import psycopg2, pandas, sklearn; print('All model libraries verified!')"
        shell: powershell

      - name: Verify DATABASE_URL
        run: |
          python -c "import os; dsn = os.environ.get('DATABASE_URL', ''); print('DATABASE_URL configured:', bool(dsn))"
        shell: powershell

      - name: Build Features
        run: python pipeline/features.py
        shell: powershell

      - name: Compute Similarity Matrix
        run: python pipeline/model_similarity.py
        shell: powershell

      - name: Validate Model & Metrics
        run: python pipeline/validate.py
        shell: powershell
