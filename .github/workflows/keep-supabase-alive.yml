name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at 06:00 UTC (well within the 7-day inactivity pause window)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL found. Pinging Postgres database..."
            python3 -c "
          import psycopg2
          import os
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute('SELECT count(*) FROM refresh_log;')
          print('Ping successful! refresh_log count:', cur.fetchone()[0])
          conn.close()
          "
          else
            echo "DATABASE_URL secret is not set!"
            exit 1
          fi
