name: Recompute Models

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Data Refresh"]
    types:
      - completed

jobs:
  model:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas scikit-learn scipy tomli

      - name: Verify DATABASE_URL
        run: |
          python -c "import os; dsn = os.environ.get('DATABASE_URL', ''); print('DATABASE_URL configured:', bool(dsn))"

      - name: Build Features
        run: python pipeline/features.py

      - name: Compute Similarity Matrix
        run: python pipeline/model_similarity.py

      - name: Validate Model & Metrics
        run: python pipeline/validate.py
