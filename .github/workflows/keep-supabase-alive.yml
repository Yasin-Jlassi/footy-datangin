name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at 06:00 UTC (well within the 7-day inactivity pause window)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL found. Pinging Postgres database..."
            psql "$DATABASE_URL" -c "SELECT count(*) FROM refresh_log;"
          else
            echo "DATABASE_URL secret is not set!"
            exit 1
          fi
